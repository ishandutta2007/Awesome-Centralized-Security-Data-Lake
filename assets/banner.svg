<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1f6beb" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 18px; fill: #8b949e; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #58a6ff; }
    .tag-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; fill: #c9d1d9; }
    
    /* Animations */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes float1 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-10px) translateX(10px); }
      100% { transform: translateY(0px) translateX(0px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(12px) translateX(-8px); }
      100% { transform: translateY(0px) translateX(0px); }
    }

    .bg-node-1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
    .bg-node-2 { animation: float2 8s ease-in-out infinite; transform-origin: center; }
    .pulse-glow { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="300" rx="16" fill="url(#grid)" />

  <!-- DYNAMIC BACKGROUND GRAPHICS (Layered behind text) -->
  <g class="bg-node-1" opacity="0.4">
    <!-- Cyber Shield Concept Background -->
    <path d="M 1000 50 L 1120 90 L 1120 180 C 1120 240 1000 270 1000 270 C 1000 270 880 240 880 180 L 880 90 Z" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="8 4" />
    <circle cx="1000" cy="160" r="60" fill="url(#purpleGlow)" opacity="0.5" />
  </g>

  <g class="bg-node-2" opacity="0.3">
    <!-- Data Stream / Waves -->
    <path d="M 50 250 Q 250 200 450 260 T 850 230 T 1150 270" fill="none" stroke="url(#emeraldGlow)" stroke-width="3" />
    <path d="M 50 220 Q 300 270 550 210 T 950 250 T 1180 210" fill="none" stroke="url(#cyanGlow)" stroke-width="1.5" stroke-dasharray="6 6" />
  </g>

  <circle cx="150" cy="70" r="100" fill="url(#cyanGlow)" opacity="0.15" class="pulse-glow" />

  <!-- FOREGROUND CONTENT -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 45)">
      <rect width="280" height="28" rx="14" fill="#1f6beb" fill-opacity="0.15" stroke="#1f6beb" stroke-width="1" />
      <text x="14" y="19" class="badge-text">CENTRALIZED SECURITY DATA LAKE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" class="title">Awesome Security Data Lake</text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle">Petabyte-Scale Telemetry Storage • Threat Hunting • OCSF Normalization • SIEM Analytics</text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 205)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="14" y="20" class="tag-text">AWS &amp; Cloud</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="145" height="32" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="156" y="20" class="tag-text">Open Source</text>

      <!-- Tag 3 -->
      <rect x="299" y="0" width="140" height="32" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="313" y="20" class="tag-text">Real-time Logs</text>

      <!-- Tag 4 -->
      <rect x="451" y="0" width="150" height="32" rx="8" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="465" y="20" class="tag-text">Threat Analytics</text>
    </g>
  </g>
</svg>
