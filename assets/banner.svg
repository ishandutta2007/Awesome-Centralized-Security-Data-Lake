<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0d1117"/><stop offset="50%" stop-color="#161b22"/><stop offset="100%" stop-color="#0a0d12"/></linearGradient><linearGradient id="cyanGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#58a6ff" stop-opacity=".8"/><stop offset="100%" stop-color="#1f6beb" stop-opacity=".2"/></linearGradient><linearGradient id="purpleGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#bc8cff" stop-opacity=".6"/><stop offset="100%" stop-color="#8957e5" stop-opacity=".1"/></linearGradient><linearGradient id="emeraldGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3fb950" stop-opacity=".7"/><stop offset="100%" stop-color="#2ea043" stop-opacity=".2"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#30363d" stroke-opacity=".3" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes float1{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-10px) translateX(10px)}}@keyframes float2{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(12px) translateX(-8px)}}.badge-text,.subtitle,.tag-text,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff}.subtitle{font-weight:400;font-size:18px;fill:#8b949e}.badge-text,.tag-text{font-weight:600;font-size:13px;fill:#58a6ff}.tag-text{font-weight:500;fill:#c9d1d9}.bg-node-1{animation:float1 6s ease-in-out infinite}.bg-node-1,.bg-node-2,.pulse-glow{transform-origin:center}.bg-node-2{animation:float2 8s ease-in-out infinite}.pulse-glow{animation:pulse 4s ease-in-out infinite}</style><rect width="1200" height="300" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" rx="16"/><rect width="1200" height="300" fill="url(#grid)" rx="16"/><g class="bg-node-1" opacity=".4"><path fill="none" stroke="url(#cyanGlow)" stroke-dasharray="8 4" stroke-width="2" d="M 1000 50 L 1120 90 L 1120 180 C 1120 240 1000 270 1000 270 C 1000 270 880 240 880 180 L 880 90 Z"/><circle cx="1000" cy="160" r="60" fill="url(#purpleGlow)" opacity=".5"/></g><g class="bg-node-2" opacity=".3"><path fill="none" stroke="url(#emeraldGlow)" stroke-width="3" d="M 50 250 Q 250 200 450 260 T 850 230 T 1150 270"/><path fill="none" stroke="url(#cyanGlow)" stroke-dasharray="6 6" stroke-width="1.5" d="M 50 220 Q 300 270 550 210 T 950 250 T 1180 210"/></g><circle cx="150" cy="70" r="100" fill="url(#cyanGlow)" class="pulse-glow" opacity=".15"/><g><g transform="translate(60, 0) translate(0, 45)"><rect width="280" height="28" fill="#1f6beb" fill-opacity=".15" stroke="#1f6beb" stroke-width="1" rx="14"/><text x="14" y="19" class="badge-text">CENTRALIZED SECURITY DATA LAKE</text></g><text x="0" y="125" class="title" transform="translate(60, 0)">Awesome Security Data Lake</text><text x="0" y="165" class="subtitle" transform="translate(60, 0)">Petabyte-Scale Telemetry Storage • Threat Hunting • OCSF Normalization • SIEM Analytics</text><g transform="translate(60, 0) translate(0, 205)"><rect width="130" height="32" x="0" y="0" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/><text x="14" y="20" class="tag-text">AWS &amp; Cloud</text><rect width="145" height="32" x="142" y="0" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/><text x="156" y="20" class="tag-text">Open Source</text><rect width="140" height="32" x="299" y="0" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/><text x="313" y="20" class="tag-text">Real-time Logs</text><rect width="150" height="32" x="451" y="0" fill="#21262d" stroke="#30363d" stroke-width="1" rx="8"/><text x="465" y="20" class="tag-text">Threat Analytics</text></g></g><